name: CI

on:
  push:
    branches: [main, security-hardening]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (H2 + MySQL migrations)
    runs-on: ubuntu-latest
    services:
      # Disposable database for MySqlMigrationIntegrationTests: each test creates and drops its own it_* schema
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend/JaswantiResidency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run tests
        run: >-
          ./mvnw -B test
          -Dmysql.it.url=jdbc:mysql://127.0.0.1:3306/
          -Dmysql.it.user=root
          -Dmysql.it.password=ci-root
      - name: Fail if the MySQL migration tests were skipped
        run: |
          report=target/surefire-reports/TEST-com.society.jaswanti.migration.MySqlMigrationIntegrationTests.xml
          test -f "$report"
          grep -q 'skipped="0"' "$report"

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jaswantiresidency
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: jaswantiresidency/package-lock.json
      - run: npm ci
      - name: Build (warnings fail the build)
        run: npm run build
        env:
          CI: 'true'
