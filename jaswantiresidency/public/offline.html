<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>No connection · Jaswanti Residency</title>
  <style>
    :root { --bg: #faf7f4; --surface: #ffffff; --text: #2b2421; --muted: #6f6560; --brand: #b23a48; --brand-ink: #ffffff; --border: #ebe3dd; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #171312; --surface: #221c1a; --text: #f3ece8; --muted: #b3a8a2; --brand: #e0717d; --brand-ink: #1a1112; --border: #3a302c; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); }
    main { width: 100%; max-width: 360px; text-align: center; background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 32px 24px; }
    .icon { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center;
      background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand); }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--brand); color: var(--brand-ink);
      font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"/><path d="M5 13a10 10 0 0 1 5.24-2.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>Jaswanti Residency couldn't reach the server. Check your internet connection and try again.</p>
    <button id="retry" type="button">Try again</button>
  </main>
  <script>
    // The app fills in the live site's address when it is built (scripts/prepare-app.js); if it still can't load,
    // the app shows this page again
    var target = '__APP_URL__';
    if (target.indexOf('__') === 0) target = window.location.origin;
    document.getElementById('retry').addEventListener('click', function () {
      this.disabled = true; this.textContent = 'Connecting…';
      window.location.replace(target.replace(/\/$/, '') + '/');
    });
  </script>
</body>
</html>
