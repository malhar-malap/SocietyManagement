# Reverse proxy (Caddy/Nginx terminating HTTPS). Tomcat honours X-Forwarded-For / X-Forwarded-Proto only when the
# connection comes from a trusted proxy address (TRUSTED_PROXIES, a regex; default: loopback and private networks),
# so the real client IP reaches sign-in throttling and the system log, and HTTPS is detected for HSTS. Never expose
# the backend port publicly: only the proxy may reach it, or anyone could claim any IP.
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:10\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|192\\.168\\.\\d{1,3}\\.\\d{1,3}|172\\.(1[6-9]|2[0-9]|3[0-1])\\.\\d{1,3}\\.\\d{1,3}|127\\.\\d{1,3}\\.\\d{1,3}\\.\\d{1,3}|0:0:0:0:0:0:0:1|::1}
